
name: Build Quillian Hexa APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract game project
        run: |
          mkdir extracted
          unzip -q Quillian_Hexa_Phone_Project.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name package.json -print -quit)")
          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "Project package.json not found"
            exit 1
          fi
          cp -R "$PROJECT_DIR"/. .

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quillian-Hexa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
